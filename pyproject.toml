[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "qraccelerator"
version = "0.1.0"
description = "QR Accelerator: a charge-redistribution in-SRAM compute architecture"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Lawrence Quizon" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
env_files = [".env"]
addopts = "-s --color=yes"
