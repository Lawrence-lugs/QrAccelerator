[pytest]
testpaths = tests
env_files = .env
addopts = -s --color=yes
markers =
    proprietary: needs Cadence/Synopsys tools or synthesized netlists; runs only with --proprietary
    ams: needs Cadence AMS output artifacts under tb/*/inputs
    heavy: long full-model simulations; runs only with --heavy
    needs_verilator: needs verilator on PATH