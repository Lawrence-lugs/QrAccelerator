DESIGN_NAME: ram_2w2r

VERILOG_FILES:
  - ../build/librelane/preprocessed/ram_2w2r.v
  - ../actmem/ihp_sram_2p_256x32_bb.v
  - ../actmem/ihp_sram_2p_1024x32_bb.v

SYNTH_PARAMETERS:
  - addrWidth=32
  - dataSize=8
  - interfaceWidth1=32
  - interfaceWidth2=256
  - depth=262144

CLOCK_PORT: clk
CLOCK_PERIOD: 20.0
CLOCK_UNCERTAINTY_CONSTRAINT: 1.0
IO_DELAY_CONSTRAINT: 20

PNR_SDC_FILE: sdc/ram_2w2r.sdc
SIGNOFF_SDC_FILE: sdc/ram_2w2r.sdc

FP_SIZING: absolute
DIE_AREA: [0, 0, 5800, 4200]

PDN_MULTILAYER: true
PDN_VERTICAL_LAYER: Metal4
PDN_HORIZONTAL_LAYER: Metal5
PDN_MACRO_CONNECTIONS:
  - 'u_impl[.]g_bank.*[.]g_rb.*[.]g_macro1024[.]u_macro VPWR VGND VDD(ARRAY)?! VSS!'
RUN_POST_GPL_DESIGN_REPAIR: false
PL_TARGET_DENSITY_PCT: 60
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 5
PL_RESIZER_HOLD_MAX_BUFFER_PCT: 5

DRT_THREADS: 8
GRT_ADJUSTMENT: 0.15

SYNTH_DRIVING_CELL: sg13g2_buf_1/A
SYNTH_CLK_DRIVING_CELL: sg13g2_buf_16/A
SYNTH_BUFFER_CELL: sg13g2_buf_1/A/X
SYNTH_STRATEGY: "AREA 3"

MACROS:
  RM_IHPSG13_2P_1024x32_c2_bm_bist:
    gds:
      - pdk_dir::libs.ref/sg13g2_sram/gds/RM_IHPSG13_2P_1024x32_c2_bm_bist.gds
    lef:
      - pdk_dir::libs.ref/sg13g2_sram/lef/RM_IHPSG13_2P_1024x32_c2_bm_bist.lef
    lib:
      "*fast*":
        - pdk_dir::libs.ref/sg13g2_sram/lib/RM_IHPSG13_2P_1024x32_c2_bm_bist_fast_1p32V_m55C.lib
      "*slow*":
        - pdk_dir::libs.ref/sg13g2_sram/lib/RM_IHPSG13_2P_1024x32_c2_bm_bist_slow_1p08V_125C.lib
      "*typ*":
        - pdk_dir::libs.ref/sg13g2_sram/lib/RM_IHPSG13_2P_1024x32_c2_bm_bist_typ_1p20V_25C.lib
    spice:
