name: Mirror physical design image

on:
  push:
    branches: [main, codex/physical-design-bounded-blocks]
    paths:
      - '.github/workflows/mirror-physical-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: qracc-physical-image
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mirror the upstream image
        shell: bash
        run: |
          source_image=ghcr.io/lawrence-lugs/lugs-soc/lugs-soc-tools:latest
          mirror="ghcr.io/${GITHUB_REPOSITORY,,}/physical-tools:latest"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$mirror" "$source_image"
          docker buildx imagetools inspect "$mirror"
