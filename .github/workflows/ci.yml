name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build devcontainer image
        run: |
          docker compose build qracc

      - name: Install submodule package
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            qraccelerator-qracc \
            bash -c "git config --global --add safe.directory /workspace/third_party/MARP && \
              conda run --no-capture-output -n ic_dec pip install -e ./third_party/MARP"

      - name: Run Python model tests
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            qraccelerator-qracc \
            bash -c "git config --global --add safe.directory /workspace/third_party/MARP && \
              conda run --no-capture-output -n ic_dec pip install -e ./third_party/MARP && \
              conda run --no-capture-output -n ic_dec python -m pytest tests/test_marp.py -v --tb=short"

      - name: Run Verilator RTL tests (seq_acc)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            qraccelerator-qracc \
            bash -c "git config --global --add safe.directory /workspace/third_party/MARP && \
              conda run --no-capture-output -n ic_dec pip install -e ./third_party/MARP && \
              conda run --no-capture-output -n ic_dec python -m pytest tests/test_rtl.py::test_seq_acc --simulator verilator \
                -k "binary and 2-32-128-8" -v --tb=short"

      - name: Run Verilator RTL tests (tb_qracc)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            qraccelerator-qracc \
            bash -c "git config --global --add safe.directory /workspace/third_party/MARP && \
              conda run --no-capture-output -n ic_dec pip install -e ./third_party/MARP && \
              conda run --no-capture-output -n ic_dec python -m pytest tests/test_rtl.py::test_tb_qracc --simulator verilator \
                -v --tb=short"

      - name: Run Verilator RTL tests (tb_column)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            qraccelerator-qracc \
            bash -c "git config --global --add safe.directory /workspace/third_party/MARP && \
              conda run --no-capture-output -n ic_dec pip install -e ./third_party/MARP && \
              conda run --no-capture-output -n ic_dec python -m pytest tests/test_rtl.py::test_tb_column --simulator verilator \
                -v --tb=short"

      - name: Run MARP tests
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            qraccelerator-qracc \
            bash -c "git config --global --add safe.directory /workspace/third_party/MARP && \
              conda run --no-capture-output -n ic_dec pip install -e ./third_party/MARP && \
              conda run --no-capture-output -n ic_dec python -m pytest third_party/MARP/tests/ -v --tb=short \
                -k "not test_from_qlinearconv""

  notebook-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install nbstripout
        run: |
          pip install nbstripout==0.9.1

      - name: Verify notebooks are stripped (excluding archive/)
        shell: bash
        run: |
          nbstripout --verify $(git ls-files '*.ipynb' | grep -v '^archive/')
