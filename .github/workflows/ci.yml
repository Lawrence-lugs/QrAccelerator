name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build devcontainer image
        run: |
          docker compose build qracc

      - name: Verify Python package and Verilator
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            qraccelerator-qracc \
            conda run --no-capture-output -n ic_dec python -c 'import qracc_marp'
          docker run --rm qraccelerator-qracc verilator --version

      - name: Run Python model tests
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            qraccelerator-qracc \
            conda run --no-capture-output -n ic_dec python -m pytest tests/test_marp.py -v --tb=short

      - name: Run Verilator RTL tests (seq_acc)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            qraccelerator-qracc \
            conda run --no-capture-output -n ic_dec python -m pytest tests/test_rtl.py::test_seq_acc --simulator verilator \
              -k "binary and 2-32-128-8" -v --tb=short

      - name: Run Verilator RTL tests (tb_qracc)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            qraccelerator-qracc \
            conda run --no-capture-output -n ic_dec python -m pytest tests/test_rtl.py::test_tb_qracc --simulator verilator \
              -v --tb=short

      - name: Run Verilator RTL tests (tb_column)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            qraccelerator-qracc \
            conda run --no-capture-output -n ic_dec python -m pytest tests/test_rtl.py::test_tb_column --simulator verilator \
              -v --tb=short

      - name: Run in-tree MARP compiler and weight-plane tests
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            qraccelerator-qracc \
            conda run --no-capture-output -n ic_dec python -m pytest \
              tests/test_internal_concat_compiler.py tests/test_weight_planes.py -v --tb=short

  notebook-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nbstripout
        run: |
          pip install nbstripout==0.9.1

      - name: Verify notebooks are stripped (excluding archive/)
        shell: bash
        run: |
          git ls-files -z -- '*.ipynb' ':(exclude)archive/**' | xargs -0 -r nbstripout --verify
