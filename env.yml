name: ic_dec
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.12
  # Core scientific stack
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - pillow
  # ML / ONNX
  - onnx
  # Testing
  - pytest
  - pytest-dotenv
  - python-dotenv
  # Notebooks & visualization
  - ipykernel
  - plotly
  - dash
  - python-kaleido
  - tqdm
  # Utilities
  - pip
  - pip:
      - rectpack
      - torch --index-url https://download.pytorch.org/whl/cpu
      - torchvision --index-url https://download.pytorch.org/whl/cpu

